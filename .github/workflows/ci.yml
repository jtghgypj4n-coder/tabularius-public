name: ci
# Pull requests, and main once merged: a push to a PR's branch already runs
# as the pull request, so it isn't run a second time. Run by hand from the
# Actions tab, it also runs the soak test.
#
# Runs on GitHub-hosted runners, which are free and unlimited for a public
# repository (never switch these to a "larger" runner: those are always billed).
# - a newer push to a pull request cancels the run it replaces;
# - on main, merges that land while a run is going wait as one run on the
#   newest commit instead of a run each;
# - changes to Markdown, screenshots, images, the licence or issue templates alone
#   don't run the tests;
# - a pull request from a fork runs here too: a hosted runner is a fresh virtual
#   machine that is thrown away, and a fork's run gets no secrets. The repository
#   setting "Require approval for all outside collaborators" stays on, and a
#   maintainer reads any change to .github/ or scripts/ before approving a run.
# - Linux runs on every pull request; macOS (a slower three-core runner, about 35
#   minutes) runs on main, nightly and by hand, and on a pull request that touches
#   what has failed there (see the `changes` job) or that carries the label `macos`.
#   It is not a required check.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'shots/**', '**.png', 'LICENSE', '.github/ISSUE_TEMPLATE/**', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['**.md', 'shots/**', '**.png', 'LICENSE', '.github/ISSUE_TEMPLATE/**', '.github/dependabot.yml']
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * *'
concurrency:
  # A pull request's newer push replaces the run it supersedes. Every push to main keeps its own run: in one shared group a
  # newer push cancels the run that is waiting, so merges landing every few minutes during a 35-minute run were never tested.
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE...HEAD")
          pattern='^(packages/store/|packages/cli/|packages/server/src/(standby|replication|logs|backup|host)|packages/server/test/(standby|upload-auth)|packages/calc/(src|test)/(evaluate|complexity)|scripts/test-ci\.ts|docs/|examples/|QUICKSTART\.md|ADMIN\.md|\.github/workflows/ci\.yml)'
          if echo ",$LABELS," | grep -q ',macos,' || echo "$files" | grep -Eq "$pattern"; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run fixtures
      - run: npm run test:ci
        env:
          TABULARIUS_SOAK: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
  test-macos:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run fixtures
      - run: npm run test:ci
