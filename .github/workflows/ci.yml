name: ci
# Pull requests, and main once merged: a push to a PR's branch already runs
# as the pull request, so it isn't run a second time. Run by hand from the
# Actions tab, it also runs the soak test.
#
# Runs on GitHub-hosted runners, which are free and unlimited for a public
# repository (never switch these to a "larger" runner: those are always billed).
# - a newer push to a pull request cancels the run it replaces;
# - on main, merges that land while a run is going wait as one run on the
#   newest commit instead of a run each;
# - changes to Markdown, screenshots, images, the licence or issue templates alone
#   don't run the tests;
# - a pull request from a fork runs here too: a hosted runner is a fresh virtual
#   machine that is thrown away, and a fork's run gets no secrets. The repository
#   setting "Require approval for all outside collaborators" stays on, and a
#   maintainer reads any change to .github/ or scripts/ before approving a run.
# - Linux runs on every pull request. macOS runs on main, nightly and by hand, and on a
#   pull request only when it carries the label `macos` (set the label before pushing; adding
#   it does not start a run). It is not a required check. GitHub's free plan runs 20 jobs at
#   once, 5 of them macOS, so macOS on every pull request left a queue of 15 and held a
#   quarter of all runners.
# - The suite is split so a run takes about 10 minutes when runners are free: `gates` (type
#   check and the repo-wide scans, once), `test-shard` (the other test files in four shards,
#   see scripts/test-plan.ts) and `test`, which only reports whether all of those passed.
#   `test` is the required check; the shard names do not matter to branch protection.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'shots/**', '**.png', 'LICENSE', '.github/ISSUE_TEMPLATE/**', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['**.md', 'shots/**', '**.png', 'LICENSE', '.github/ISSUE_TEMPLATE/**', '.github/dependabot.yml']
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * *'
concurrency:
  # A pull request's newer push replaces the run it supersedes. Every push to main keeps its own run: in one shared group a
  # newer push cancels the run that is waiting, so merges landing every few minutes during a 35-minute run were never tested.
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run fixtures
      - run: npm run gates
  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - run: npm run test:ci -- --shard=${{ matrix.shard }}/4
        env:
          TABULARIUS_SOAK: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
  test:
    needs: [gates, test-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "gates: ${{ needs.gates.result }}, shards: ${{ needs.test-shard.result }}"
          [ "${{ needs.gates.result }}" = success ] && [ "${{ needs.test-shard.result }}" = success ]
  test-macos:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos') }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - run: npm run test:ci -- --shard=${{ matrix.shard }}/3
