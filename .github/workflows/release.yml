# Single-file builds of Tabularius for macOS (arm64, x64), Linux (x64, arm64) and Windows
# (scripts/build-release.ts), each checked on the machine it was built on
# (scripts/release-smoke.ts), then put together into a GitHub release (scripts/release-assemble.ts).
#
# - A tag like v0.1.0 builds that version and, once CI is green on the tagged commit, makes a DRAFT release
#   with the programs, their bills of materials, the licence notices, get.sh (the one-line installer) and one
#   SHA256SUMS. Nothing is public until a person clicks Publish. The notes come from
#   .github/release-notes/v0.1.0.md (required for a release without a "-" in its version).
# - Run by hand from the Actions tab, it builds only. Give "version" (for example 0.1.0-rc.1) and set "publish"
#   to draft or prerelease to also make a release. That works only from main, only once CI has passed on the
#   commit (the same check as for a tag), only for a pre-release (the version must contain a "-") and only for
#   a tag that does not exist yet.
# - The Windows program is built and attached when it builds and passes its check; if it does not, the release is
#   made without it. The other four systems are required: if one fails, no release is made.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and name the files with, such as 0.1.0-rc.1 (empty: named after the commit)'
        required: false
        default: ''
      publish:
        description: 'Also make a GitHub release from this run (the version must contain a "-")'
        type: choice
        options: [none, draft, prerelease]
        default: none
permissions:
  contents: read
jobs:
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run release:verify-repro
  # The commit (a tag's, or a manual run's that will publish) must be on main, and CI must have passed on it (or on a commit before it that differs only in files the CI
  # skips: Markdown, images, the licence).
  ci-green:
    if: ${{ github.event_name == 'push' || inputs.publish != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a green ci run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main. Release a commit that is on main."; exit 1; }
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=50" --jq '.workflow_runs[].head_sha'); do
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || continue
            other=$(git diff --name-only "$sha" "$GITHUB_SHA" | grep -v -E '\.md$|^shots/|\.png$|^LICENSE$|^\.github/ISSUE_TEMPLATE/|^\.github/dependabot\.yml$' || true)
            if [ -z "$other" ]; then echo "ci passed on $sha, which is $GITHUB_SHA or differs from it only in files ci skips"; exit 0; fi
          done
          echo "::error::No successful ci run on main for $GITHUB_SHA. Get ci green on this commit, then re-run this workflow."
          exit 1
  build:
    needs: reproducible
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is x64, ubuntu-24.04-arm is arm64, macos-latest is arm64, macos-15-intel is x64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        include:
          - os: windows-latest
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run fixtures
      - name: Build
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = push ]; then version="${GITHUB_REF_NAME#v}"; else version="${INPUT_VERSION#v}"; fi
          node scripts/build-release.ts --out dist ${version:+--version "$version"}
      - name: Sign it
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: node scripts/sign-release.ts dist/tabularius-*
      - name: Checksums
        shell: bash
        run: |
          for program in dist/tabularius-*; do
            case "$program" in *.sha256|*.sbom.cdx.json|*.pack) continue ;; esac
            node scripts/verify-release.ts write "$program"
            node scripts/verify-release.ts verify "${program%.exe}.sha256"
          done
      - name: Check it
        shell: bash
        run: node scripts/release-smoke.ts dist/tabularius-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tabularius-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/tabularius-*
            dist/THIRD-PARTY-NOTICES.md
          if-no-files-found: error
  publish:
    needs: [build, ci-green]
    # A tag push, or a manual run from main that asks for a draft or pre-release; ci-green must have passed.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.ci-green.result == 'success' && (github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.publish != 'none')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Put the release together
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = push ]; then tag="$GITHUB_REF_NAME"; else tag="v${INPUT_VERSION#v}"; fi
          version="${tag#v}"
          # Checked before anything is written to GITHUB_ENV (a line break in the input would add lines there).
          printf '%s' "$version" | grep -E -q '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::\"$version\" is not a version such as 0.1.0 or 0.1.0-rc.1."; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" != push ]; then
            case "$version" in *-*) ;; *) echo "::error::A manual run can only make a pre-release: give a version with a \"-\", such as 0.1.0-rc.1."; exit 1 ;; esac
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then echo "::error::The tag $tag already exists."; exit 1; fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node scripts/release-assemble.ts artifacts release --version "$version" --require linux-x64,linux-arm64,macos-arm64,macos-x64
      - name: Notes
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            case "$VERSION" in
              *-*) printf 'A test build of %s. Not for use: the release is %s.\n' "$VERSION" "${VERSION%%-*}" > "$RUNNER_TEMP/notes.md"; notes="$RUNNER_TEMP/notes.md" ;;
              *) echo "::error::Write the release notes first: $notes"; exit 1 ;;
            esac
          fi
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "Tabularius $VERSION" --notes-file "$NOTES" --target "$GITHUB_SHA")
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          # A tag always gets a draft, which a person publishes. A manual run publishes only when asked to.
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$PUBLISH" = draft ]; then args+=(--draft); fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then args+=(--verify-tag); fi
          gh release create "$TAG" "${args[@]}" release/*
          { echo "### $TAG"; echo; ls -1 release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
